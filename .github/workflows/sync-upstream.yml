# Merges agentscope-ai/agentscope main into this fork's main.
# Scheduled runs only happen once this file is on the default branch.
name: Sync upstream

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge agentscope-ai/agentscope main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Optional PAT. A push made with the default token does not start
          # other workflows; a PAT does, and can also pass branch protection
          # when its owner is allowed to push to main.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream/main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/agentscope-ai/agentscope.git
          git fetch upstream main

          # This fork only keeps sync-upstream.yml. Drop anything upstream
          # adds under .github/workflows, and treat a conflict there as
          # "keep it deleted" so the daily merge can still finish.
          drop_other_workflows() {
            find .github/workflows -type f ! -name 'sync-upstream.yml' -delete
            git add -A .github/workflows
          }

          changed=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is $(git rev-list --count HEAD..upstream/main) commit(s) ahead."
            if ! git merge --no-edit upstream/main \
                -m "Merge upstream agentscope-ai/agentscope main"; then
              : > "$RUNNER_TEMP/conflicts.txt"
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$path" in
                  .github/workflows/sync-upstream.yml)
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    ;;
                  .github/workflows/*)
                    git rm -f -- "$path"
                    ;;
                  *)
                    echo "$path" >> "$RUNNER_TEMP/conflicts.txt"
                    ;;
                esac
              done < <(git diff --name-only --diff-filter=U)

              if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
                git merge --abort
                echo "status=conflict" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit --no-edit
            fi
            changed=true
          else
            echo "Already up to date with upstream/main."
          fi

          drop_other_workflows
          if ! git diff --cached --quiet; then
            git commit -m "ci: keep only the upstream sync workflow"
            changed=true
          fi

          if [ "$changed" = true ]; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main
        if: steps.merge.outputs.status == 'merged'
        run: git push origin HEAD:main

      - name: Open an issue for conflicts
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "自动合并上游失败：main 与 agentscope-ai/agentscope 冲突"
        run: |
          set -euo pipefail
          {
            echo "定时任务无法把 \`agentscope-ai/agentscope\` 的 \`main\` 合并进本仓库 \`main\`，因为这些文件有冲突："
            echo
            echo '```'
            cat "$RUNNER_TEMP/conflicts.txt"
            echo '```'
            echo
            echo "请在本地解决后推送："
            echo
            echo '```bash'
            echo "git fetch https://github.com/agentscope-ai/agentscope.git main"
            echo "git checkout main && git pull"
            echo "git merge FETCH_HEAD"
            echo "git add -A && git commit && git push"
            echo '```'
            echo
            echo "工作流：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"

          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 1
